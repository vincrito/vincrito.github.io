</style>

"new-epoc":{t:"Systemic chemotherapy with or without cetuximab in resectable CRLM (New EPOC)",c:"Bridgewater JA et al. Lancet Oncol. 2020;21(4):e1-e10.",y:2020,q:"Should cetuximab be added perioperatively in RAS WT resectable CRLM?",p:"Patients with resectable RAS WT CRLM (n=272)",i:"Perioperative chemotherapy + cetuximab",co:"Perioperative chemotherapy alone",o:"Overall survival; progression-free survival",kr:"Median OS 55.4 months (cetuximab) vs 81.0 months (no cetuximab), HR 1.45 (p=0.036). Median PFS 15.5 vs 22.2 months, HR 1.48 (p=0.003). Both endpoints significantly worse with cetuximab.",tw:"Cetuximab worsened OS: 55 vs 81 months. A cautionary tale: benefit in unresectable disease does not predict benefit in the resectable setting.",u:"https://pubmed.ncbi.nlm.nih.gov/32014119/"},
"kras-2015":{t:"Effect of KRAS mutation on long-term outcomes after hepatic resection for CRLM",c:"Margonis GA et al. J Clin Oncol. 2015;33(21):2367-2374.",y:2015,q:"How does KRAS change surgical thinking?",p:"Patients undergoing hepatic resection for CRLM with known KRAS status (n=1,007, multi-institutional)",i:"KRAS mutation (any codon)",co:"KRAS wild-type",o:"Overall survival, recurrence-free survival, recurrence patterns",kr:"5-yr OS: KRAS mutant 38.2% vs WT 53.3% (p<0.001). 5-yr RFS: 19.3% vs 33.2% (p<0.001). Lung recurrence: 37% (mutant) vs 22% (WT, p<0.001). Extrahepatic recurrence significantly higher in KRAS mutant.",tw:"KRAS mutation is associated with worse survival and more extrahepatic/lung recurrence after hepatectomy. Changes counseling and surveillance - does not prohibit surgery.",u:"https://pubmed.ncbi.nlm.nih.gov/26077912/"},
"kras-2016":{t:"Codon 13 KRAS mutation predicts patterns of recurrence after hepatectomy for CRLM",c:"Margonis GA et al. Cancer. 2016;122(17):2698-2707.",y:2016,q:"Is all KRAS the same?",p:"Patients with resected CRLM and known KRAS codon status (n=681)",i:"KRAS codon 13 mutation specifically",co:"KRAS codon 12 mutations and KRAS WT",o:"Hepatic, extrahepatic, and pulmonary recurrence patterns",kr:"Pulmonary recurrence: codon 13 52% vs codon 12 32% (p=0.02). Codon 13 independently associated with worse RFS (HR 1.68, p=0.02). No significant difference in hepatic-only recurrence between codon 12 and 13.",tw:"Codon-specific KRAS biology matters. Codon 13 correlates with worse extrahepatic and lung recurrence - relevant to surveillance planning.",u:"https://pubmed.ncbi.nlm.nih.gov/27244540/"},
"braf-2013":{t:"Incidence and prognostic impact of KRAS and BRAF mutation in patients undergoing liver surgery for colorectal metastases",c:"Karagkounis G et al. Cancer. 2013;119(23):4137-4144.",y:2013,q:"What does BRAF V600E do to your enthusiasm for surgery?",p:"Patients undergoing liver resection for CRLM with molecular profiling (n=378)",i:"BRAF V600E or KRAS mutation",co:"Wild-type BRAF and KRAS",o:"Disease-specific survival, recurrence-free survival",kr:"BRAF V600E prevalence 7.4%. Median DSS 24.9 mo (BRAF mut) vs 64.1 mo (WT). 5-yr DSS 24% vs 55% (p<0.001). BRAF mutation independently associated with worse DSS on multivariable analysis.",tw:"BRAF mutation is uncommon (~5-8% of CRLM) but signals aggressive biology and worse outcomes after resection.",u:"https://pubmed.ncbi.nlm.nih.gov/24104864/"},
"braf-2019":{t:"BRAF mutation is not associated with an increased risk of recurrence after CRLM resection",c:"Bachet J-B et al. Br J Surg. 2019;106(9):1237-1247.",y:2019,q:"Is BRAF V600E an absolute contraindication to surgery?",p:"Patients with BRAF-mutated CRLM who underwent resection (multi-institutional)",i:"BRAF V600E mutation",co:"BRAF wild-type patients after resection",o:"Recurrence rate, overall survival, recurrence-free survival",kr:"No statistically significant difference in recurrence or OS by BRAF status after R0 resection in this multi-institutional cohort (n=52 BRAF mut). Caveat: small BRAF-mutant sample and retrospective design limit conclusions.",tw:"Not necessarily. BRAF should change expectations and counseling - not automatically forbid resection in selected patients.",u:"https://pubmed.ncbi.nlm.nih.gov/31183866/"},
"ctdna-2021":{t:"Circulating tumour DNA analysis for improved recurrence surveillance after CRLM resection",c:"Reinert T et al. Gut. 2021;70(12):2294-2301.",y:2021,q:"Does ctDNA predict recurrence earlier than imaging?",p:"Patients after curative resection of CRLM with ctDNA monitoring",i:"Postoperative tumor-informed ctDNA surveillance",co:"Standard imaging-based surveillance",o:"Lead time to recurrence detection; prognostic accuracy",kr:"ctDNA-positive post-resection: 3-yr RFS 0% vs 44% ctDNA-negative (HR 10.0, p<0.001). Lead time advantage 6.1 months before imaging detection of recurrence. Sensitivity 91%, specificity 88%.",tw:"ctDNA detects recurrence 6-12 months before imaging in many patients and outperforms standard clinical risk factors as a prognostic tool.",u:"https://pubmed.ncbi.nlm.nih.gov/34994972/"},
"ctdna-2024":{t:"Personalized circulating tumor DNA monitoring improves recurrence surveillance after curative resection of CRLM",c:"Li Y et al. Int J Surg. 2024.",y:2024,q:"Can ctDNA change surveillance and salvage strategy?",p:"Patients after curative resection of CRLM (prospective cohort)",i:"Personalized ctDNA monitoring protocol",co:"Conventional surveillance (imaging + CEA)",o:"Recurrence detection sensitivity and specificity; impact on salvage therapy",kr:"ctDNA sensitivity 82%, specificity 94% for recurrence detection. PPV 91%. Median lead time 5.5 months before clinical recurrence. ctDNA-guided strategy changed clinical management in 38% of cases.",tw:"Prospective data support ctDNA for early recurrence detection and may guide decisions about repeat local therapy.",u:"https://pubmed.ncbi.nlm.nih.gov/38445460/"},
"ligro-2024":{t:"Long-term follow-up from the randomized LIGRO trial (ALPPS vs two-stage hepatectomy)",c:"Sandstrom P et al. Ann Surg. 2024.",y:2024,q:"Can ALPPS create resectability with meaningful long-term outcomes?",p:"Patients with bilobar CRLM requiring staged resection (LIGRO RCT)",i:"ALPPS (associating liver partition and portal vein ligation for staged hepatectomy)",co:"Two-stage hepatectomy with portal vein occlusion",o:"Resectability rate (primary); overall survival at long-term follow-up",kr:"Resectability rate 92% (ALPPS) vs 57% (TSH), p<0.001. 5-yr OS comparable (31% vs 29%, NS). 90-day major morbidity higher with ALPPS (43% vs 26%). Median OS not significantly different.",tw:"ALPPS achieves faster hypertrophy and higher R0 resection rates than two-stage hepatectomy, with comparable long-term outcomes in selected patients.",u:"https://pubmed.ncbi.nlm.nih.gov/39310365/"},
"collision-2025":{t:"Thermal ablation versus surgical resection of small-size CRLM (COLLISION trial)",c:"COLLISION Trial Group. Lancet Oncol. 2025.",y:2025,q:"Is resection always superior for small resectable lesions?",p:"Patients with resectable CRLM up to 3 cm (randomized, multi-center)",i:"Thermal ablation (microwave or radiofrequency)",co:"Surgical resection",o:"Overall survival (non-inferiority primary); local recurrence rate",kr:"3-yr OS 80.6% (ablation) vs 80.0% (resection), non-inferiority margin 10% met. Local recurrence 11.5% (ablation) vs 4.0% (resection, p<0.001). No significant difference in distant recurrence or DFS.",tw:"For lesions up to 3 cm, thermal ablation is non-inferior to resection for OS. Supports parenchymal-sparing ablation for small peripheral lesions in selected patients.",u:"https://pubmed.ncbi.nlm.nih.gov/39848272/"},
"calgb-9481":{t:"Hepatic arterial infusion versus systemic therapy for hepatic metastases from colorectal cancer (CALGB 9481)",c:"Kemeny NE et al. J Clin Oncol. 2006;24(9):1395-1403.",y:2006,q:"Does HAI improve outcomes over systemic therapy alone?",p:"Patients with unresectable hepatic metastases from CRC (n=135)",i:"Hepatic arterial infusion chemotherapy (FUDR via implanted pump)",co:"Systemic chemotherapy (FUDR or 5-FU)",o:"Response rate (primary); overall survival",kr:"Response rate 47% (HAI) vs 24% (systemic, p<0.001). Median OS 24.4 vs 20.0 months (p=0.003). Conversion to resectability 16% vs 4% (p=0.048). 2-yr OS 45% vs 32%.",tw:"Response rate 47% vs 24% (p<0.001); median OS 24.4 vs 20.0 months. One of the few randomized HAI trials showing improved response and conversion in liver-dominant disease.",u:"https://pubmed.ncbi.nlm.nih.gov/16505413/"},
"koerkamp-2017":{t:"Perioperative HAI pump chemotherapy is associated with longer survival after resection of colorectal liver metastases: a propensity score analysis",c:"Groot Koerkamp B et al. J Clin Oncol. 2017;35(17):1938-1944.",y:2017,q:"Does perioperative HAI improve OS after complete resection of CRLM?",p:"Patients with complete resection of CRLM, 1992-2012, single institution (n=2,368)",i:"Perioperative HAI + systemic chemotherapy (n=785)",co:"Systemic chemotherapy only (n=1,583); propensity score matched",o:"Overall survival; 10-year OS; subgroup by clinical risk score",kr:"Median OS 67 vs 44 months (HAI vs no HAI, propensity matched, HR 0.60, p<0.001). 10-yr OS 38% vs 24%. Effect persisted in the modern systemic chemotherapy era. Strongest benefit: low CRS and node-negative primary.",tw:"Median OS 67 vs 44 months with vs without HAI (propensity matched). 10-year OS 38% vs 24%. Effect persisted with modern systemic chemotherapy. Strongest benefit in low clinical risk score and node-negative primary.",u:"https://pubmed.ncbi.nlm.nih.gov/28426374/"},
"dangelica-2015":{t:"Phase II trial of hepatic artery infusional and systemic chemotherapy for patients with unresectable hepatic metastases from colorectal cancer: conversion to resection and long-term outcomes",c:"D'Angelica MI, Correa-Gallego C et al. Ann Surg. 2015;261(2):353-360.",y:2015,q:"Can HAI + systemic chemotherapy convert unresectable CRLM to resectable, and does conversion improve survival?",p:"49 patients with unresectable CRLM (65% previously treated), phase II single-arm trial",i:"HAI (FUDR) + systemic chemotherapy, with or without bevacizumab",co:"N/A - single-arm; resected vs non-resected patients compared on landmark analysis",o:"Conversion to resection rate (primary); overall survival, progression-free survival (secondary)",kr:"Conversion rate 47% (23/49). Median OS 38 months, median PFS 13 months (all patients). Landmark analysis: 3-yr OS 80% (resected, n=23) vs 26% (non-resected, n=26), p<0.001.",tw:"47% conversion rate. 3-year OS 80% vs 26% in resected vs non-resected. But this is a selection effect - patients who converted may have had favorable biology independent of surgery. The survival benefit may be in the responders, not the operation itself.",u:"https://pubmed.ncbi.nlm.nih.gov/24646562/"}
};

var STEPS=[{"type":"title","sec":"Introduction","title":"How I Think About Colorectal Liver Metastases","sub":"A Surgical Oncologist's Approach to Decision Making","body":"Camilo Correa, MD|2026","qs":["Can I remove it?","Should I remove it?","When should I remove it?"],"ids":[]},{"type":"poll","sec":"Introduction","title":"Opening Poll","opts":["A: Less than 10%","B: 10-20%","C: 20-40%","D: More than 40%"],"body":"What percentage of patients with CRLM are ultimately cured after surgery?","ids":["tomlinson-2007"]},{"type":"slide","sec":"Introduction","title":"The Five Questions","bul":["1. Can all disease be eradicated?","2. What is the biology?","3. What information would chemotherapy provide?","4. What role does liver-directed therapy play?","5. Why am I operating?"],"ids":[]},{"type":"case","sec":"Case 1: The Anatomy Question","title":"Case 1","vig":"55-year-old man. Sigmoid adenocarcinoma. CEA 12. Three liver metastases on staging CT. No obvious extrahepatic disease.","ids":[]},{"type":"slide","sec":"Case 1: The Anatomy Question","title":"Workup: What Matters?","bul":["MRI liver/Triphasic CT: identifies occult disease, clarifies segmental anatomy and proximity to major vasculature","Molecular profile: KRAS, BRAF, MSI, ctDNA","CT chest/abd/pelvis: rules out extrahepatic disease","Performance status: determines operative tolerance","Social Reserve"],"ids":[]},{"type":"wrongq","sec":"Case 1: The Anatomy Question","title":"Wrong Question","ids":["fong-1999","adam-2004"]},{"type":"slide","sec":"Case 1: The Anatomy Question","title":"Resectability: Then vs Now","bul":["1995: 4 or fewer lesions, unilobar disease, no extrahepatic disease, node-negative primary","Today: any number of lesions, bilobar disease, limited extrahepatic disease in selected patients","The criterion shifted from counting lesions to: adequate remnant + achievable margins + favorable biology"],"ids":["adam-2004","fong-1999"]},{"type":"case","sec":"Case 2: Technical vs Oncologic Resectability","title":"Case 2","sub":"Technical vs Oncologic Resectability","vig":"12 bilobar metastases. No extrahepatic disease. Good performance status. CT shows clearable disease with a two-stage approach or ALPPS.","ids":[]},{"type":"slide","sec":"Case 2: Technical vs Oncologic Resectability","title":"Creating Resectability","bul":["Portal vein embolization (PVE): hypertrophy of future liver remnant","Total venous deprivation (PVE + HVE): combined portal and hepatic vein occlusion for faster hypertrophy","Two-stage hepatectomy: staged resections when one-stage remnant is insufficient","ALPPS: rapid bilobar clearance","Ablation: parenchymal-sparing option for lesions < 3cm"],"ids":["adam-2004","ligro-2024"]},{"type":"slide","sec":"Case 2: Technical vs Oncologic Resectability","title":"Technical vs Oncologic Resectability","bul":["Technical: adequate remnant, achievable margins, patient tolerates the operation","Oncologic: biology suggests meaningful and durable benefit from resection","In 2026, most patients are technically resectable. The question should always be oncologic.","Surgical techniques solve the anatomy problem. Not the biology problem."],"ids":[]},{"type":"case","sec":"Molecular Staging","title":"Case Update: Molecular Profile","sub":"Back to Case 1","vig":"55-year-old man. Sigmoid adenocarcinoma. CEA 12. Three liver metastases on staging CT. No obvious extrahepatic disease. KRAS G12D mutation is present.","ids":["kras-2015"]},{"type":"slide","sec":"Molecular Staging","title":"Molecular Staging","bul":["RAS: most common; codon-specific biology matters for recurrence patterns","BRAF V600E: uncommon, aggressive biology, changes counseling significantly","MSI-H: rare in CRLM; immunotherapy-eligible, surgery still plays a role","HER2: emerging target, relevant to systemic therapy choice","ctDNA: post-operative surveillance and recurrence prediction"],"ids":["kras-2015","kras-2016","braf-2013"]},{"type":"slide","sec":"Molecular Staging","title":"KRAS: What It Means for Surgery","bul":["Worse OS after hepatectomy: roughly 10-15% difference at 5 years","More lung recurrence, especially codon 13 mutations","More margin recurrence","Does not prohibit surgery: changes counseling, surveillance intensity, and threshold for re-resection"],"ids":["kras-2015","kras-2016"]},{"type":"case","sec":"Molecular Staging","title":"BRAF V600E","sub":"Technically resectable. Operate?","vig":"Same favorable anatomy as Case 1. BRAF V600E mutation on molecular profiling. No extrahepatic disease.","ids":["braf-2013","braf-2019"]},{"type":"slide","sec":"Molecular Staging","title":"ctDNA After R0 Resection","bul":["ctDNA detects recurrence 6-12 months before imaging in many patients","Positive ctDNA after R0 hepatectomy predicts recurrence with high specificity","Negative ctDNA correlates with improved disease-free survival","Not yet a decision rule - the best biology marker we have right now"],"body":"Post-operative ctDNA is positive after an R0 hepatectomy.","ids":["ctdna-2021","ctdna-2024"]},{"type":"slide","sec":"Molecular Staging","title":"Good Biology vs Bad Biology","sub":"Build your own framework.","bul":["Favorable: RAS WT, BRAF WT, MSI-H, ctDNA negative, response to chemotherapy, long disease-free interval, node-negative primary","Unfavorable: KRAS G12D/G12V, BRAF V600E, N2 primary, synchronous presentation, short disease-free interval, progression on chemotherapy, positive ctDNA after treatment"],"ids":["fong-1999"]},{"type":"transition","sec":"Timing","title":"Biology determines whether surgery matters.","body":"Once anatomy is favorable and biology does not prohibit surgery, the question is timing.","ids":[]},{"type":"poll","sec":"Timing: Surgery vs Chemotherapy","title":"Poll: Timing","opts":["Team Surgery First","Team Chemotherapy First"],"body":"Resectable CRLM. Good anatomy. RAS wild-type. No extrahepatic disease. Surgery first or chemotherapy first?","ids":[]},{"type":"slide","sec":"Timing: Surgery vs Chemotherapy","title":"Team Surgery First","bul":["Avoid chemotherapy hepatotoxicity: sinusoidal obstruction syndrome, oxaliplatin neuropathy","Avoid disappearing lesions: hard to find on imaging, harder to localize intraoperatively","No risk of progression converting resectable to unresectable (?)"],"ids":["eortc-2008"]},{"type":"slide","sec":"Timing: Surgery vs Chemotherapy","title":"Team Chemotherapy First","bul":["Window to assess biology: progression on therapy is a stop rule before a major operation","Downstage marginally resectable disease to create a safer resection","Treat occult micrometastatic disease early","Identify the responders for whom surgery will matter most"],"ids":["eortc-2008","adam-2004"]},{"type":"slide","sec":"Timing: Surgery vs Chemotherapy","title":"EORTC 40983","bul":["PFS improved: ~36% vs 28% at 3 years (HR ~0.77)","OS: no statistically significant difference at long-term follow-up","Surgical complication rate higher in the perioperative chemotherapy arm"],"body":"Perioperative FOLFOX vs surgery alone in resectable CRLM.","ids":["eortc-2008","eortc-2013"]},{"type":"slide","sec":"Timing: Surgery vs Chemotherapy","title":"JCOG0603","bul":["DFS improved: 49.8 vs 24.9 months (HR 0.56)","OS: not significantly improved"],"body":"Hepatectomy + adjuvant mFOLFOX6 vs hepatectomy alone.","ids":["jcog0603"]},{"type":"slide","sec":"Timing: Surgery vs Chemotherapy","title":"New EPOC","bul":["OS: 55 months with cetuximab vs 81 months without - a meaningful harm","Cetuximab improves response in unresectable disease; worsens outcomes in resectable disease","Do not extrapolate across disease stages / treatment settings"],"body":"Perioperative chemotherapy with or without cetuximab in RAS WT resectable CRLM.","ids":["new-epoc-2014","new-epoc"]},{"type":"slide","sec":"Timing: Surgery vs Chemotherapy","title":"My Timing Algorithm","bul":["Surgery first: clearly resectable, low-risk biology, concern for disappearing lesions","Chemotherapy first: biology uncertain, marginal resectability, high tumor burden, need to test response","Either: clearly resectable, no concern for disappearing lesions, RAS WT with straightforward anatomy and low biology risk","Progression on therapy while technically resectable should prompt reconsideration of surgical plan"],"ids":["eortc-2008","jcog0603"]},{"type":"slide","sec":"Local Therapy: Ablation and HAI","title":"Local Therapy Goals","sub":"Match the modality to the goal.","bul":["Curative intent: resection when anatomy and biology allow","Conversion: chemotherapy with or without HAI to downstage, then reassess","Liver control: ablation, HAI, or both for liver-dominant disease","Parenchymal sparing: ablation for small peripheral lesions in patients with limited remnant","Poor PS: ablation, radiation therapy, Y90 if poor surgical tolerance anticipated"],"ids":[]},{"type":"case","sec":"Local Therapy: Ablation and HAI","title":"Case: Ablation vs Resection","vig":"3 peripheral lesions, all 2 cm or less, in a patient with prior right hepatectomy. Limited future liver remnant. Good performance status.","ids":["collision-2025"]},{"type":"slide","sec":"Local Therapy: Ablation and HAI","title":"COLLISION Trial","bul":["OS: non-inferior for ablation in size-matched lesions","Local recurrence higher with ablation, but salvageable in most cases","Does not mean ablation equals resection for all CRLM: it means ablation is reasonable for small peripheral lesions where remnant is the constraint"],"body":"Randomized trial of thermal ablation vs surgical resection for CRLM up to 3 cm.","ids":["collision-2025"]},{"type":"slide","sec":"Local Therapy: Ablation and HAI","title":"Why HAI Chemotherapy?","bul":["First-pass extraction: high local drug concentration, lower systemic exposure","Always combined with systemic therapy","Most useful in liver-dominant disease where liver control is the limiting factor for survival"],"body":"The liver is the dominant site of failure in CRLM. HAI delivers floxuridine (FUDR) at concentrations 10-400x higher than IV administration, via the hepatic artery, with lower systemic toxicity.","ids":["calgb-9481"]},{"type":"slide","sec":"Local Therapy: Ablation and HAI","title":"HAI Data","bul":["CALGB 9481 (RCT): response rate 47% vs 24% (p<0.001); median OS 24.4 vs 20.0 months","Groot Koerkamp 2017 (n=2,368, propensity matched): median OS 67 vs 44 months; 10-year OS 38% vs 24%","Effect persisted in the era of modern systemic chemotherapy","Strongest benefit in low clinical risk score and node-negative primary"],"ids":["calgb-9481","koerkamp-2017"]},{"type":"slide","sec":"Local Therapy: Ablation and HAI","title":"Conversion with HAI: The Selection Question","bul":["Median OS and PFS: 38 and 13 months","47% conversion rate / 3-year OS 80% vs 26% in resected vs non-resected patients","We do not know those patients did well because of the surgery","Surgery may be a marker of favorable biology, not the cause of survival"],"body":"D'Angelica, Correa-Gallego et al. Ann Surg 2015","ids":["dangelica-2015"]},{"type":"trial","sec":"Local Therapy: Ablation and HAI","title":"Ongoing HAI Trials","ids":[]},{"type":"slide","sec":"Local Therapy: Ablation and HAI","title":"Who I consider for HAI","bul":["Liver-only or liver-dominant disease without evidence of systemic progression","Conversion candidates: unresectable disease, good performance status, response to systemic therapy","Why is not every center doing this? Pump placement expertise, medical oncology expertise, and infrastructure all limit access."],"ids":["calgb-9481","koerkamp-2017"]},{"type":"case","sec":"The Hardest Question","title":"Case 3","vig":"BRAF V600E. Progression on two lines of systemic chemotherapy. Technically resectable on current imaging.","ids":["braf-2013","braf-2019"]},{"type":"transition","sec":"The Hardest Question","title":"Does surgery add any meaningful benefit?","body":"Am I helping the patient, or treating the scan? Technical resectability and oncologic benefit are not the same thing.","ids":[]},{"type":"slide","sec":"Synthesis","title":"The Five Questions","bul":["1. Can all disease be eradicated? - anatomy, remnant, technical feasibility","2. What is the biology? - molecular profile, ctDNA, response to treatment","3. What information would chemotherapy provide? - test biology, downstage, identify responders","4. What role does liver-directed therapy play? - ablation, HAI, staged resections","5. Why am I operating? - true benefit, or treating the scan?"],"ids":[]},{"type":"case","sec":"Synthesis","title":"Return to Case 1","sub":"Now you have the framework. Answer all five questions.","vig":"55-year-old man. Sigmoid adenocarcinoma. RAS wild-type. ctDNA negative after neoadjuvant chemotherapy. No extrahepatic disease. Three resectable liver metastases.","ids":["tomlinson-2007","kras-2015","ctdna-2021"]},{"type":"slide","sec":"Synthesis","title":"Conclusion","bul":["Trials tell you what happened on average and evolve over time.","The patient in front of you is not average.","The five questions are a framework for applying evidence to individual decisions."],"ids":[]},{"type":"closing","sec":"Synthesis","title":"The Standard of Care Is Judgment","ids":[]}];
var cur=0;

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function render(){
  var step=STEPS[cur],total=STEPS.length;
  var pct=((cur+1)/total)*100;
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('slideNum').textContent=(cur+1)+' / '+total;
  document.getElementById('prevBtn').disabled=(cur===0);
  document.getElementById('nextBtn').disabled=(cur===total-1);
  document.getElementById('slide').innerHTML=buildCard(step,cur+1,total);
  document.querySelectorAll('.chip').forEach(function(el){
    el.addEventListener('click',function(){openModal(el.getAttribute('data-id'));});
  });
}

function buildCard(s,n,total){
  var isdk=(s.type==='title'||s.type==='transition'||s.type==='closing');
  var h='<div class="card type-'+s.type+'">';
  h+='<div class="card-header"><span class="card-section">'+esc(s.sec)+'</span><span class="card-num">'+n+' / '+total+'</span></div>';

  if(s.type==='title'){
    h+='<h2>'+esc(s.title)+'</h2>';
    if(s.sub)h+='<p class="card-sub">'+esc(s.sub)+'</p>';
    if(s.body){s.body.split('|').forEach(function(line,idx){h+='<p class="card-sub" style="color:rgba(255,255,255,.55);margin-top:'+(idx===0?'clamp(14px,2.5vh,32px)':'6px')+';">'+esc(line.trim())+'</p>';});}
    if(s.qs){h+='<div class="title-qs">';s.qs.forEach(function(q){h+='<span class="title-q">'+esc(q)+'</span>';});h+='</div>';}
  } else if(s.type==='transition'){
    h+='<h2>'+esc(s.title)+'</h2>';
    if(s.body)h+='<p class="card-body">'+esc(s.body)+'</p>';
  } else if(s.type==='closing'){
    h+='<h2>'+esc(s.title)+'</h2>';
    h+='<div class="closing-rule"></div>';
  } else if(s.type==='wrongq'){
    h+='<h2>'+esc(s.title)+'</h2>';
    h+='<p class="wq-cross">How many metastases are too many?</p>';
    h+='<div class="wq-lbl">Better question</div>';
    h+='<p class="wq-right">Can all disease be eradicated while preserving adequate liver function?</p>';
    h+='<p class="wq-note">Number-based resectability criteria: 1995. Today: margin, remnant, and biology.</p>';
  } else if(s.type==='poll'){
    h+='<h2>'+esc(s.title)+'</h2>';
    if(s.body)h+='<p class="card-body">'+esc(s.body)+'</p>';
    if(s.opts){h+='<div class="poll-opts">';s.opts.forEach(function(o){h+='<div class="poll-opt">'+esc(o)+'</div>';});h+='</div>';}
  } else if(s.type==='case'){
    h+='<h2>'+esc(s.title)+'</h2>';
    if(s.sub)h+='<p class="card-sub">'+esc(s.sub)+'</p>';
    if(s.vig)h+='<div class="vignette">'+esc(s.vig)+'</div>';
  } else if(s.type==='trial'){
    h+='<h2>'+esc(s.title)+'</h2>';
    h+='<div class="trial-row">';
    h+='<img src="../hai%20trial%20prop.png" alt="Adjuvant HAI trial proposal under ECOG review, June 2026">';
    h+='<div class="trial-text">';
    h+='<p class="card-section" style="margin-bottom:8px;">PUMP Trial (NCT05863195, EA2222)</p>';
    h+='<ul class="bullets"><li>ECOG-ACRIN Phase III, actively recruiting</li><li>HAI + systemic chemotherapy vs systemic alone for unresectable CRLM</li><li>Primary endpoint: overall survival</li><li>~60 sites, target enrollment 408; Mount Sinai is a participating site</li></ul>';
    h+='<p class="card-section" style="margin-top:14px;margin-bottom:6px;">Adjuvant HAI after Resection (proposed)</p>';
    h+='<p class="card-body" style="font-size:.9rem;">Proposal under review by ECOG executive committee, June 2026</p>';
    h+='</div></div>';
  } else {
    h+='<h2>'+esc(s.title)+'</h2>';
    if(s.sub)h+='<p class="card-sub">'+esc(s.sub)+'</p>';
    if(s.body)h+='<p class="card-body">'+esc(s.body)+'</p>';
    if(s.bul){h+='<ul class="bullets">';s.bul.forEach(function(b){h+='<li>'+esc(b)+'</li>';});h+='</ul>';}
  }

  if(s.ids&&s.ids.length){
    h+='<div class="chips">';
    s.ids.forEach(function(id){var st=S[id];if(st)h+='<button class="chip" data-id="'+esc(id)+'">'+esc(st.c.split(' ')[0]+' '+st.y)+'</button>';});
    h+='</div>';
  }
  h+='</div>';
  return h;
}

function buildRefs(){
  var g=document.getElementById('refsGrid');
  var ids=Object.keys(S).sort(function(a,b){return S[a].y-S[b].y;});
  var h='';
  ids.forEach(function(id){
    var st=S[id];
    h+='<button class="ref-card" data-id="'+esc(id)+'">';
    h+='<span class="ref-yr">'+st.y+'</span>';
    h+='<div class="ref-body"><h4>'+esc(st.t)+'</h4><p>'+esc(st.c)+'</p><p class="ref-pm">Open PubMed</p></div>';
    h+='</button>';
  });
  g.innerHTML=h;
  g.querySelectorAll('.ref-card').forEach(function(el){
    el.addEventListener('click',function(){openModal(el.getAttribute('data-id'));closeRefs();});
  });
}

function openModal(id){
  var st=S[id];if(!st)return;
  document.getElementById('mYr').textContent=st.y;
  document.getElementById('mTt').textContent=st.t;
  document.getElementById('mCt').textContent=st.c;
  document.getElementById('mQ').textContent=st.q;
  document.getElementById('mP').textContent=st.p;
  document.getElementById('mI').textContent=st.i;
  document.getElementById('mC').textContent=st.co;
  document.getElementById('mO').textContent=st.o;
  document.getElementById('mKr').textContent=st.kr||'';
  document.getElementById('mTw').textContent=st.tw;
  document.getElementById('mPm').href=st.u;
  document.getElementById('modalOv').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modalOv').classList.remove('open');}
function openRefs(){document.getElementById('refsOv').classList.add('open');}
function closeRefs(){document.getElementById('refsOv').classList.remove('open');}

function goNext(){if(cur<STEPS.length-1){cur++;render();}}
function goPrev(){if(cur>0){cur--;render();}}

document.getElementById('nextBtn').addEventListener('click',goNext);
document.getElementById('prevBtn').addEventListener('click',goPrev);
document.getElementById('refsBtn').addEventListener('click',openRefs);
document.getElementById('refsClose').addEventListener('click',closeRefs);
document.getElementById('mCl1').addEventListener('click',closeModal);
document.getElementById('mCl2').addEventListener('click',closeModal);
document.getElementById('refsOv').addEventListener('click',function(e){if(e.target===this)closeRefs();});
document.getElementById('modalOv').addEventListener('click',function(e){if(e.target===this)closeModal();});

document.addEventListener('keydown',function(e){
  var mo=document.getElementById('modalOv').classList.contains('open');
  var ro=document.getElementById('refsOv').classList.contains('open');
  if(e.key==='Escape'){if(mo){closeModal();return;}if(ro){closeRefs();return;}}
  if(mo||ro)return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();goNext();}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();goPrev();}
});

render();
buildRefs();
})();

</script>
</body>
</html>
